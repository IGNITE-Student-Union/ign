name: Deploy to WPEngine

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deploy to'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          # - staging  # staging environment no longer exists; re-enable when recreated

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build assets
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: built-theme
          path: .
          exclude: |
            node_modules
            .git

  # Staging environment no longer exists (decommissioned). Kept here, disabled,
  # in case it gets recreated later — re-enable the job and the workflow_dispatch
  # 'staging' option above if so.
  # deploy-staging:
  #   name: Deploy → Staging
  #   needs: build
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging'
  #   environment:
  #     name: staging
  #     url: https://ignitesustg.wpengine.com
  #   steps:
  #     - name: Download build artifact
  #       uses: actions/download-artifact@v4
  #       with:
  #         name: built-theme
  #
  #     - name: Deploy to WPEngine Staging
  #       uses: wpengine/github-action-wpe-site-deploy@v3
  #       with:
  #         WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
  #         WPE_ENV: ignitesustg
  #         REMOTE_PATH: "wp-content/themes/ign/"
  #         FLAGS: -azvr --inplace --delete --exclude=.git --exclude=node_modules --exclude=.env
  #         CACHE_CLEAR: TRUE

  deploy-production:
    name: Deploy → Production
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://ignitestudentu.wpengine.com
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: built-theme

      - name: Deploy to WPEngine Production
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ignitestudentu
          REMOTE_PATH: "wp-content/themes/ign/"
          # custom-plugins/ is excluded here because it is NOT part of the
          # theme - it is deployed to wp-content/plugins/ by the job below.
          # Without this exclude it would also be copied into the theme
          # folder, where it would sit unused (WordPress does not load
          # plugins from inside a theme).
          FLAGS: -azvr --inplace --delete --exclude=.git --exclude=node_modules --exclude=.env --exclude=custom-plugins
          CACHE_CLEAR: TRUE

  # ---------------------------------------------------------------------
  # Custom plugins we author live in custom-plugins/<plugin>/ in this repo
  # and deploy to wp-content/plugins/<plugin>/ on the server.
  #
  # Only plugins we wrote are deployed this way. WordPress core and
  # third-party plugins are deliberately NOT in this repo: WP Engine and
  # WordPress update those themselves, and versioning them here would mean
  # fighting those updates on every release.
  #
  # Like the theme deploy above, this is an incremental rsync - unchanged
  # files are not transferred, and --delete only removes files that no
  # longer exist in the repo, so the server stays an exact mirror of
  # custom-plugins/myignite-event-importer/.
  # ---------------------------------------------------------------------
  deploy-plugin-myignite-importer:
    name: Deploy → MyIGNITE Event Importer plugin
    # Depends on the THEME deploy, not on build, purely to serialise them.
    # WP Engine's SSH gateway refuses a second concurrent session: with both
    # jobs on `needs: build` they started together, the theme rsync won, and
    # this one sat for 7 minutes before failing with "Failed to create shell"
    # / "rsync error: code 12" - while the run still deployed the theme, so
    # the site looked updated and only the plugin was silently left behind.
    needs: deploy-production
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
    environment:
      name: production
      url: https://ignitestudentu.wpengine.com
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: built-theme

      - name: Deploy plugin to WPEngine Production
        uses: wpengine/github-action-wpe-site-deploy@v3
        with:
          WPE_SSHG_KEY_PRIVATE: ${{ secrets.WPE_SSHG_KEY_PRIVATE }}
          WPE_ENV: ignitestudentu
          SRC_PATH: "custom-plugins/myignite-event-importer/"
          REMOTE_PATH: "wp-content/plugins/myignite-event-importer/"
          FLAGS: -azvr --inplace --delete --exclude=.git
          CACHE_CLEAR: TRUE